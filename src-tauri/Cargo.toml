[package]
name = "pomodoro"
version = "1.0.1"
description = "Minimal Pomodoro floating widget"
authors = ["Yeonseo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
xcap = "0.9"
image = "0.25"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
